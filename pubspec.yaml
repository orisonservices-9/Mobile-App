name: orison_parent_app
description: Parent-only mobile app for Orison School ERP.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  intl: ^0.20.2
  image_picker: ^1.1.2
  file_picker: ^10.3.8
  qr_flutter: ^4.1.0
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
